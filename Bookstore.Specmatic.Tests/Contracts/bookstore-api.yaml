
openapi: 3.0.3

info:
  title: Online Bookstore API
  description: API contract for managing books and customer orders
  version: 1.0.0

servers:
  - url: http://localhost:9000

tags:
  - name: Books
  - name: Orders

paths:

  /api/books:
    get:
      tags:
        - Books
      summary: Get all books
      operationId: getAllBooks
      responses:
        '200':
          description: Successfully retrieved all books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/{id}:
    get:
      tags:
        - Books
      summary: Get a book by ID
      operationId: getBookById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            enum: [1, 2, 3]
          example: 1
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/books/search:
    get:
      tags:
        - Books
      summary: Search books by title
      operationId: searchBooks
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
            example: Clean
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/orders:
    get:
      tags:
        - Orders
      summary: Get all orders
      operationId: getAllOrders
      responses:
        '200':
          description: Successfully retrieved all orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

    post:
      tags:
        - Orders
      summary: Create a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              validOrder:
                summary: Create an order using an existing book
                value:
                  customerName: Nikitha
                  items:
                    - bookId: 1
                      quantity: 1
                      price: 450.00
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get an order by ID
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            enum: [1]
          example: 1
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:

  schemas:

    Book:
      type: object
      required:
        - id
        - title
        - author
        - isbn
        - price
        - stockQuantity
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin
        isbn:
          type: string
          example: '9780132350884'
        price:
          type: number
          format: double
          example: 450.00
        stockQuantity:
          type: integer
          example: 10

    Order:
      type: object
      required:
        - id
        - customerName
        - items
        - totalAmount
        - status
      properties:
        id:
          type: integer
          example: 1
        customerName:
          type: string
          example: Specmatic Test Customer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalAmount:
          type: number
          format: double
          example: 450.00
        status:
          type: string
          enum:
            - Pending
            - Confirmed
            - Shipped
            - Delivered
          example: Pending

    OrderItem:
      type: object
      required:
        - bookId
        - quantity
        - price
      properties:
        bookId:
          type: integer
          enum: [1, 2, 3]
          example: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          example: 1
        price:
          type: number
          format: double
          example: 450.00

    CreateOrderRequest:
      type: object
      required:
        - customerName
        - items
      properties:
        customerName:
          type: string
          example: Nikitha
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Resource not found
